version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      bagimliliklar:
        patterns: ['*']
        update-types: [minor, patch]
    # Büyük sürüm geçişleri (ör. TypeScript, Astro) elle ve ayrı ayrı yapılır.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
