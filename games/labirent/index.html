<body>
  <noscript><p class="uyari">Bu defteri açmak için JavaScript gerekiyor.</p></noscript>
  <p class="gizli" id="duyuru" role="status" aria-live="polite"></p>

  <main class="defter" id="defter">
    <a class="defterde-donus" href="/">← İçindekiler</a>
    <section class="sayfa" id="sayfa" aria-label="Labirent sayfası">
      <header class="ust-marj" id="ust-marj">
        <h1 class="baslik beyaz"><span class="yazi" id="baslik">Labirent</span></h1>
        <p class="kronometre gumus" id="kronometre" role="timer"><span class="yazi">0:00</span></p>
        <nav class="modlar" id="modlar" aria-label="Modlar"></nav>
        <p class="kunye gumus" id="kunye"></p>
      </header>

      <div class="alan" id="alan">
        <canvas class="ekran" id="ekran" aria-label="Labirent" role="img"></canvas>
      </div>

      <footer class="alt-marj" id="alt-marj">
        <div class="sonuc bos" id="sonuc" aria-hidden="true"></div>
        <nav class="komutlar" id="komutlar" aria-label="Komutlar"></nav>
      </footer>

      <!-- Kalem notları: sayfanın üstünde açılır -->
      <section class="not" id="not-serbest" aria-labelledby="serbest-baslik" hidden>
        <h2 class="not-baslik beyaz" id="serbest-baslik">Serbest</h2>
        <div id="serbest-secim"></div>
        <p class="not-satir"><span class="not-ad gumus">kod</span> <span class="kod gumus" id="serbest-kod"></span>
          <button class="dugme sozcuk" id="kod-kopyala" type="button"><span class="yazi">kodu kopyala</span></button>
          <button class="dugme sozcuk" id="link-kopyala" type="button"><span class="yazi">linki kopyala</span></button></p>
        <p class="not-satir"><label class="not-ad gumus" for="kod-gir">kod gir</label>
          <input class="kod-gir" id="kod-gir" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="D-O-W-7KQ9">
          <button class="dugme sozcuk" id="kod-ac" type="button"><span class="yazi">aç</span></button></p>
        <p class="not-uyari gumus" id="kod-not" role="status" aria-live="polite"></p>
        <p class="not-komut"><button class="dugme sozcuk" id="serbest-yeni" type="button"><span class="yazi">Yeni labirent</span></button>
          <button class="dugme sozcuk" type="button" data-kapat="not-serbest"><span class="yazi">kapat</span></button></p>
      </section>
      <section class="not" id="not-hayalet" aria-labelledby="hayalet-baslik" hidden>
        <h2 class="not-baslik beyaz" id="hayalet-baslik">Hayalet</h2>
        <p class="not-aciklama gumus">rakip ilk çizginle başlar; önce çıkan kazanır</p>
        <div id="hayalet-secim"></div>
        <p class="not-uyari gumus" id="hayalet-not" role="status" aria-live="polite"></p>
        <p class="not-komut"><button class="dugme sozcuk" type="button" data-kapat="not-hayalet"><span class="yazi">kapat</span></button></p>
      </section>
      <section class="not" id="not-bolum" aria-labelledby="bolum-baslik" hidden>
        <h2 class="not-baslik beyaz" id="bolum-baslik">Bölümler</h2>
        <p class="not-aciklama gumus">her türün defterinde kolaydan zora 20 seviye; biten sonrakini açar</p>
        <div id="bolum-liste"></div>
        <p class="not-komut"><button class="dugme sozcuk" type="button" data-kapat="not-bolum"><span class="yazi">kapat</span></button></p>
      </section>
      <section class="not" id="not-ayarlar" aria-labelledby="ayarlar-baslik" hidden>
        <h2 class="not-baslik beyaz" id="ayarlar-baslik">Ayarlar</h2>
        <p class="not-satir"><span class="not-ad gumus">kalem</span> <span class="renkler" id="renk-secim"></span></p>
        <div id="iz-secim"></div>
        <div id="uv-secim"></div>
        <div id="genel-secim"></div>
        <p class="not-komut"><button class="dugme sozcuk" type="button" data-kapat="not-ayarlar"><span class="yazi">kapat</span></button></p>
      </section>
    </section>
  </main>

  <!-- Yazdır: yalnız baskıda görünür (ui/yazdir.js doldurur) -->
