# Kağıt Hangar: statik site. Build yok; dosyalar olduğu gibi sunulur.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Sürümlü yol: index.html her derlemede kod, stil ve varlıkları /v/<sürüm>/... üstünden ister. Sürüm her
  # dağıtımda değişir, o yüzden bu dosyalar bir yıl önbellekte kalabilir; eski sürümle yenisi hiç karışmaz
  # (Cloudflare'in tarayıcı önbellek süresi ayarı ne olursa olsun).
  location ~ ^/v/[^/]+/(.+)$ {
    rewrite ^/v/[^/]+/(.+)$ /$1 break;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Kod ve tasarımlar her dağıtımda değişebilir: tarayıcı her seferinde doğrulasın (ETag ile hızlı).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* \.(png|jpg)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Simge ve uygulama bildirimi: olmayan dosyaya SPA'nın index.html'i dönmesin.
  location = /favicon.ico {
    try_files $uri =404;
    access_log off;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
}
